name: Build AyuGram Portable (Manual)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Official release tag (e.g. v7.2.9), or latest'
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package official Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout portable builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon extraction tools
        run: python -m pip install --disable-pip-version-check icoextract==0.3.0 Pillow==11.3.0

      - name: Self-test builder logic
        run: python -m unittest discover -v -s tests

      - name: Download official AyuGram release and create portable package
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: python tools/build.py --release "$env:UPSTREAM_REF" --out dist

      - name: Compile AyuGramPortable.exe with the upstream icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path -LiteralPath $csc)) { throw 'The .NET Framework C# compiler is missing on this runner.' }
          # IMPORTANT: The .NET Framework csc.exe can strip the folder component
          # from a relative source path that contains a forward slash.
          # Resolve the .cs file to an absolute Windows path before compilation.
          $source = (Resolve-Path -LiteralPath '.\launcher\AyuGramPortable.cs' -ErrorAction Stop).Path
          $icon = (Resolve-Path -LiteralPath '.\dist\AyuGramPortable\App\AppInfo\appicon.ico' -ErrorAction Stop).Path
          $destination = (Resolve-Path -LiteralPath '.\dist\AyuGramPortable' -ErrorAction Stop).Path
          $exe = Join-Path $destination 'AyuGramPortable.exe'
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Launcher source file missing: $source" }
          if (!(Test-Path -LiteralPath $icon -PathType Leaf)) { throw "App icon missing: $icon" }
          Write-Host "Launcher source: $source"
          Write-Host "Original icon: $icon"
          Write-Host "Output launcher: $exe"
          # Pass the absolute .cs path as one distinct compiler argument.
          & $csc '/nologo' '/target:winexe' '/platform:x64' '/optimize+' "/win32icon:$icon" "/out:$exe" '/reference:System.Windows.Forms.dll' $source
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Portable launcher compilation failed (compiler exit code $LASTEXITCODE)."
          }

      - name: Verify layout, native launcher, and user-data isolation
        run: python tools/verify.py --root dist/AyuGramPortable

      - name: Create final ZIP with one top-level AyuGramPortable folder
        shell: pwsh
        run: python tools/package.py --root dist/AyuGramPortable --out dist/AyuGramPortable-Win64.zip

      - name: Publish ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Portable-Windows-x64
          path: dist/AyuGramPortable-Win64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
